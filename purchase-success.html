<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Business Builder Is Ready</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0B0D1E;color:#C8C3BC;font-family:Inter,sans-serif;padding:24px}.card{width:min(660px,100%);background:#191C35;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:42px;box-shadow:0 28px 80px rgba(0,0,0,.35)}.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#818CF8;font-weight:800}h1{font-size:clamp(28px,5vw,42px);color:#F5F0EB;margin:12px 0;letter-spacing:-.04em}p{line-height:1.7}.summary{background:#12152B;border-radius:13px;padding:16px 18px;margin:24px 0}.actions{display:flex;flex-wrap:wrap;gap:12px}.btn{display:inline-flex;justify-content:center;align-items:center;padding:14px 20px;border-radius:11px;text-decoration:none;font-weight:800;border:0;cursor:pointer;font:inherit}.primary{background:linear-gradient(135deg,#4F46E5,#7C3AED,#0EA5E9);color:#fff}.secondary{border:1px solid rgba(255,255,255,.16);color:#F5F0EB;background:transparent}.hidden{display:none}.status{font-size:13px;color:#98989D;margin-top:18px}</style></head><body><main class="card"><div class="tag">Payment successful</div><h1>Your business toolkit is ready.</h1><p>Your files are tailored to the business type you selected and include every template and prompt listed in your package.</p><div class="summary" id="summary">Verifying your purchase…</div><div class="actions"><a class="btn primary hidden" id="download">Download My Package →</a><a class="btn secondary hidden" id="calendly" target="_blank" rel="noopener">Book Your Consultation Now →</a><a class="btn secondary" href="/">Return Home</a></div><div class="status" id="status"></div></main><script>
(async function(){const id=new URLSearchParams(location.search).get('session_id');const summary=document.getElementById('summary'),status=document.getElementById('status');if(!id){summary.textContent='The checkout session is missing.';return}try{const r=await fetch('/api/package-download?info=1&session_id='+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw new Error(d.error||'Verification failed');summary.innerHTML='<strong style="color:#F5F0EB">'+d.name+'</strong><br>'+d.businessType+' toolkit';const download=document.getElementById('download');download.href='/api/package-download?session_id='+encodeURIComponent(id);download.classList.remove('hidden');if(d.consultation&&d.calendlyUrl){const c=document.getElementById('calendly');c.href=d.calendlyUrl;c.classList.remove('hidden')}else if(d.consultation){status.textContent='Your consultation is included. Erika will send the booking link by email.'}}catch(e){summary.textContent=e.message;status.textContent='Please contact hello@productimagination.com with your payment email.'}})();
</script></body></html>
